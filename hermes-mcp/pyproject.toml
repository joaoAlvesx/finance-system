[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-hermes-mcp"
version = "0.6.0"
description = "Adaptador MCP isolado para a API do Finance System"
requires-python = ">=3.13,<3.15"
dependencies = [
  "mcp>=2.2,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
finance-hermes-mcp = "finance_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["finance_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
